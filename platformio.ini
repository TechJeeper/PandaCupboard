; PandaCupboard – PandaTouch / K-Touch Bambu Lab fleet dashboard
; Board support taken from PaxxTouch (ESP32-S3 + LVGL).

[platformio]
default_envs = pandacupboard-arduino-3x

[env]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -I include
  -DLV_CONF_INCLUDE_SIMPLE
  -DBOARD_HAS_PSRAM
  -DPANDACUPBOARD_VERSION=\"0.2.0\"
  -DCORE_DEBUG_LEVEL=0
  -DMQTT_MAX_PACKET_SIZE=32768
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps =
  lvgl/lvgl@9.3.0
  tamctec/TAMC_GT911@1.0.2
  moononournation/GFX Library for Arduino@1.6.1
  bblanchon/ArduinoJson@7.3.0
  knolleary/PubSubClient@2.8
  bitbank2/PNGdec@1.1.6
  bodmer/TJpg_Decoder@1.1.0

[env:pandacupboard-arduino-3x]
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.7
  platformio/framework-arduinoespressif32-libs @ https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.0.7.zip
extra_scripts = pre:build_files_exclude.py
custom_build_files_exclude = */Arduino_ESP32LCD8.cpp */Arduino_ESP32QSPI.cpp
board_build.sdkconfig_options =
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
build_flags =
  ${env.build_flags}
  -DPT_LVGL_RENDER_PARTIAL_LINES=16
  -DPT_LCD_RENDER_BOUNCE_LINES=20
